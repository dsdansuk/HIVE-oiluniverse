<div class="panel" id="panel-support" style="width:100%;overflow-y:auto;">
<div style="max-width:800px;margin:0 auto;padding:24px 20px 100px;">
<!-- 탭 (v107: AI 상담 제거, FAQ 기본 활성화) -->
<div style="display:flex;gap:8px;margin-bottom:20px;background:var(--gray-light);border-radius:12px;padding:4px;">
<button id="stab-faq" onclick="switchSupportTab('faq')" style="flex:1;padding:9px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;background:var(--green-main);color:#fff;font-family:var(--font-body);">📋 식용유 클레임 Q&amp;A</button>
<button id="stab-ask" onclick="switchSupportTab('ask')" style="flex:1;padding:9px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:var(--gray);font-family:var(--font-body);">✉️ 문의 접수</button>
</div>
<!-- FAQ 탭 (v107: 기본 활성화) -->
<div id="stab-content-faq">
<div style="background:linear-gradient(135deg,var(--green-dark),var(--green-main));border-radius:16px;padding:18px 22px;margin-bottom:18px;color:#fff;position:relative;overflow:hidden;">
<div style="position:absolute;top:-20px;right:-20px;width:120px;height:120px;background:radial-gradient(circle,rgba(255,255,255,0.15),transparent 70%);"></div>
<div style="position:relative;z-index:1;">
<div style="font-size:10.5px;font-weight:700;color:rgba(255,255,255,0.7);letter-spacing:0.1em;margin-bottom:4px;">CONSUMER CLAIMS GUIDE</div>
<div style="font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-0.03em;color:#fff;margin-bottom:5px;">식용유 제품 클레임 Q&amp;A</div>
<div style="font-size:12px;color:rgba(255,255,255,0.85);">소비자 클레임 유형별 답변 가이드 · 10가지 유형</div>
</div>
</div>
<div id="faqList"></div>
<!-- 🆕 v108: 고객센터 연결 CTA (원문 매치) -->
<div style="margin-top:24px;background:linear-gradient(135deg,#0F2419,#1F4D30);border-radius:14px;padding:22px 24px;text-align:center;color:#fff;">
<div style="font-size:16px;font-weight:800;margin-bottom:6px;letter-spacing:-0.02em;">☎ 고객센터 연결</div>
<div style="font-size:12px;color:rgba(255,255,255,0.8);margin-bottom:14px;line-height:1.6;">
              제품 관련 문의는 아래 버튼을 통해 접수해 주세요.<br/>
              빠르게 확인 후 안내드리겠습니다.
            </div>
<button onclick="switchSupportTab('ask')" style="background:#FFEB3B;color:#0F2419;border:none;border-radius:10px;padding:11px 22px;font-size:13px;font-weight:800;cursor:pointer;font-family:var(--font-body);">📨 문의 접수하기</button>
</div>
</div>
<!-- 문의 접수 탭 -->
<div id="stab-content-ask" style="display:none;">
<div style="background:var(--white);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;">
<div style="font-size:14px;font-weight:800;margin-bottom:16px;">✉️ 새 문의 접수</div>
<div style="margin-bottom:12px;">
<label style="font-size:12px;font-weight:700;color:var(--gray);margin-bottom:6px;display:block;">문의 유형</label>
<select id="askType" style="width:100%;padding:10px 12px;border:1.5px solid var(--gray-light);border-radius:8px;font-size:13px;font-family:var(--font-body);">
<option value="품질">🍳 품질 이슈</option>
<option value="납품">🫙 납품 관련</option>
<option value="수거">♻️ 폐유 수거</option>
<option value="계산서">📄 계산서/정산</option>
<option value="앱">📱 앱 사용법</option>
<option value="기타">💬 기타</option>
</select>
</div>
<div style="margin-bottom:12px;">
<label style="font-size:12px;font-weight:700;color:var(--gray);margin-bottom:6px;display:block;">업체명</label>
<input id="askBiz" placeholder="업체명을 입력하세요" style="width:100%;padding:10px 12px;border:1.5px solid var(--gray-light);border-radius:8px;font-size:13px;font-family:var(--font-body);box-sizing:border-box;" type="text"/>
</div>
<div style="margin-bottom:16px;">
<label style="font-size:12px;font-weight:700;color:var(--gray);margin-bottom:6px;display:block;">문의 내용</label>
<textarea id="askContent" placeholder="문의 내용을 자세히 입력해주세요" rows="4" style="width:100%;padding:10px 12px;border:1.5px solid var(--gray-light);border-radius:8px;font-size:13px;font-family:var(--font-body);box-sizing:border-box;resize:vertical;"></textarea>
</div>
<button onclick="submitAsk()" style="width:100%;background:var(--green-main);border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;color:#fff;font-family:var(--font-body);">✉️ 문의 접수하기</button>
</div>
<!-- 접수된 문의 목록 (관리자에게만 보임) -->
<div id="askListSection" style="display:none;">
<div style="font-size:14px;font-weight:800;margin-bottom:12px;">📬 접수된 문의 <span id="askCount" style="font-size:12px;color:var(--gray);font-weight:500;"></span></div>
<div id="askList"></div>
</div>
</div>
</div>
</div>
