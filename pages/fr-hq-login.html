<div class="panel" id="panel-fr-hq-login" style="overflow-y:auto;width:100%;">
<div style="max-width:440px;margin:60px auto;padding:0 24px;">
<div style="text-align:center;margin-bottom:28px;">
<div style="font-size:44px;margin-bottom:10px;">🏪</div>
<div style="font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-0.03em;margin-bottom:5px;color:var(--green-dark);">프랜차이즈 본사 로그인</div>
<div style="font-size:12px;color:var(--gray);">브랜드 본사 담당자 전용</div>
</div>
<div class="card" style="padding:26px;">
<div class="form-group">
<label class="form-label">본사 아이디</label>
<input class="form-input" id="frHqLoginInputId" onkeydown="if(event.key==='Enter')document.getElementById('frHqLoginInputPw').focus()" placeholder="발급받은 본사 ID" style="font-size:14px;"/>
</div>
<div class="form-group">
<label class="form-label">비밀번호</label>
<input class="form-input" id="frHqLoginInputPw" onkeydown="if(event.key==='Enter')frHqLoginSubmit()" placeholder="비밀번호" style="font-size:14px;" type="password"/>
</div>
<button class="btn btn-primary" onclick="frHqLoginSubmit()" style="width:100%;justify-content:center;padding:13px;font-size:14px;background:var(--green-dark);">🔐 로그인</button>
<div id="frHqLoginStatus" style="font-size:12px;text-align:center;margin-top:10px;min-height:14px;color:#C62828;"></div>
</div>
<div style="margin-top:18px;padding:14px 16px;background:var(--green-pale);border-radius:10px;font-size:12px;color:var(--green-dark);line-height:1.7;">
<div style="font-weight:800;margin-bottom:5px;">💡 본사 ID/비밀번호는</div>
<div>식용유니버스 담당자(<b>김기봉</b>)가 발급해서 직접 전달드립니다.</div>
<div style="margin-top:6px;">계약 미체결 또는 분실 시 <b>010-XXXX-XXXX</b>로 연락주세요.</div>
</div>
</div>
</div>
