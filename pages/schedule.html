<div class="panel" id="panel-schedule">
<div style="background:linear-gradient(135deg,#1F4D30,#0D2B1A);padding:18px 32px;color:#fff;">
<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
<div>
<div style="font-size:10.5px;font-weight:800;color:rgba(255,255,255,0.7);letter-spacing:0.1em;margin-bottom:3px;">DRIVER WEEKLY</div>
<div style="font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-0.02em;">📅 드라이버 주간 일정</div>
<div style="font-size:11.5px;color:rgba(255,255,255,0.75);margin-top:3px;">자동 잡힌 방문일 + 메모를 한눈에</div>
</div>
<div style="display:flex;gap:6px;">
<button onclick="changeScheduleWeek(-1)" style="background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;">◀ 이전</button>
<button onclick="changeScheduleWeek(0)" style="background:#FFEB3B;color:#0F2419;border:none;border-radius:8px;padding:9px 15px;font-size:12px;font-weight:800;cursor:pointer;">이번 주</button>
<button onclick="changeScheduleWeek(1)" style="background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;">다음 ▶</button>
</div>
</div>
</div>
<div style="padding:22px 32px 40px;width:100%;box-sizing:border-box;">
<!-- 주차 + 드라이버 선택 한 줄 -->
<div style="display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:18px;">
<div id="scheduleWeekRange" style="font-size:14px;font-weight:800;color:var(--green-dark);background:#fff;padding:14px 20px;border-radius:12px;box-shadow:var(--shadow);display:flex;align-items:center;"></div>
<select id="scheduleDriverSelect" onchange="renderDriverSchedule()" style="padding:13px 14px;border:1.5px solid var(--gray-light);border-radius:12px;font-size:13px;font-weight:700;font-family:var(--font-body);background:#fff;box-shadow:var(--shadow);">
<option value="">🚛 전체 드라이버</option>
</select>
</div>
<!-- 🆕 v144: 주간 요약 KPI -->
<div id="scheduleSummary" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px;">
<!-- JS 렌더 -->
</div>
<!-- 주간 일정 컨테이너 -->
<div id="driverScheduleGrid">
<div style="text-align:center;padding:30px;color:var(--gray);font-size:13px;background:#fff;border-radius:12px;box-shadow:var(--shadow);">불러오는 중...</div>
</div>
<div style="margin-top:22px;background:linear-gradient(135deg,#FFF8E1,#FFF3E0);border-radius:12px;padding:15px 20px;font-size:12px;color:#7A4F00;line-height:1.8;">
          💡 <strong>일정 출처</strong>: 자동발주·수거 신청 시 잡힌 방문일이 자동 표시됩니다. 메모는 [📝 메모 추가] 클릭으로 입력하세요.<br/>
          🚛 <strong>운영 팁</strong>: 동선이 비슷한 업체는 같은 요일에 묶어서 처리하면 효율적입니다.
        </div>
</div>
</div>
